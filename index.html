<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06120c" />

    <!-- Primary SEO -->
    <title>AgriFlow — The 3D Agri-Supply Marketplace</title>
    <meta name="description" content="AgriFlow connects farmers directly with verified fertilizer and seed suppliers. Real-time stock, transparent pricing, and ACID-safe transactions powering every order." />
    <meta name="keywords" content="agriculture, fertilizer marketplace, seeds, farmers, suppliers, agri-supply, agritech, Pakistan agriculture" />
    <meta name="author" content="AgriFlow" />
    <link rel="canonical" href="https://agriflow.example.com/" />

    <!-- OpenGraph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AgriFlow" />
    <meta property="og:title" content="AgriFlow — The 3D Agri-Supply Marketplace" />
    <meta property="og:description" content="Real-time stock, transparent pricing, and ACID-safe orders connecting farmers to verified suppliers." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AgriFlow — sourcing agri-supplies, reimagined in 3D" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://agriflow.example.com/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AgriFlow — The 3D Agri-Supply Marketplace" />
    <meta name="twitter:description" content="Where every harvest begins. Real-time fertilizer and seed marketplace for farmers and suppliers." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Performance: preconnect to font CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data — search engines surface this richly -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "AgriFlow",
        "description": "3D agri-supply marketplace connecting farmers and suppliers with real-time stock and ACID-safe transactions.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body class="bg-forest-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
